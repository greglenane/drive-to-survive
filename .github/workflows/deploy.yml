name: F1 ETL and Dashboard Deploy

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # --- ETL ---
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv python install
      - run: uv sync --no-install-project

      - name: Run ETL
        env:
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_REGION: ${{ secrets.S3_REGION }}
        run: |
          uv run pipeline/download-last-race.py
          uv run pipeline/download-picks.py
          uv run pipeline/convert-results.py
          uv run pipeline/score-results.py
          uv run pipeline/picks-scored.py
      
      # --- Quality Checks ---
      - name: Quality Checks
        env:
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_REGION: ${{ secrets.S3_REGION }}
        run: |
          uv run quality_checks/check-missing-picsk.py
          uv run quality_checks/check-missing-results.py
          uv run quality_checks/check-na.py

      # --- Evidence ---
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build Evidence
        env:
          BASE_PATH: /drive-to-survive
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_REGION: ${{ secrets.S3_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.S3_REGION }}
        run: |
          npm install
          npm run sources
          npm run build

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/drive-to-survive

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
