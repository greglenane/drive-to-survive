name: F1 ETL Only

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # --- ETL ---
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv python install
      - run: uv sync --no-install-project

      - name: Run ETL
        env:
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_REGION: ${{ secrets.S3_REGION }}
          EXCEL_URL: ${{ secrets.EXCEL_URL }}
        run: |
          uv run pipeline/download-last-race.py
          uv run pipeline/download-picks.py
          uv run pipeline/convert-results.py
          uv run pipeline/score-results.py
          uv run pipeline/picks-scored.py
      
      # --- Quality Checks ---
      - name: Quality Checks
        env:
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_REGION: ${{ secrets.S3_REGION }}
        run: |
          uv run quality_checks/check-missing-picks.py
          uv run quality_checks/check-missing-results.py
          uv run quality_checks/check-na.py